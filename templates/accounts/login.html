{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 420px;">
    <h2 class="mb-4 text-center">Login to BloodSync</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        {% if form.errors %}
        <div class="alert alert-danger py-2">Invalid username or password.</div>
        {% endif %}
        <button type="submit" class="btn btn-danger w-100">Login</button>
    </form>
    <p class="text-center mt-3">Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}

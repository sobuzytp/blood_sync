{% extends 'base.html' %}

{% block title %}Delete Donor Profile{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card shadow-sm p-4 text-center">
        <h4>Delete Donor Profile?</h4>
        <p>Are you sure you want to delete <strong>{{ donor.name }}</strong>'s donor profile? This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100 mb-2">Yes, Delete</button>
        </form>
        <a href="{% url 'donors:detail' donor.pk %}" class="btn btn-outline-secondary w-100">Cancel</a>
    </div>
</div>
{% endblock %}
